name: Android validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Test release helpers
        run: python3 -B -m unittest discover -s tools/release/tests -v
      - name: Verify resolved runtime and third-party notices
        run: |
          bash gradlew :app:releaseDependencyInventory --no-daemon --no-configuration-cache --console=plain
          python3 tools/release/notices.py --check
      - name: Test, lint and build isolated test APKs
        run: bash gradlew testDebugUnitTest lintRelease assembleDebug assembleDebugAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: music-validation-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
