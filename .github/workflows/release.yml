name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: music-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore signing material
        env:
          KEYSTORE: ${{ secrets.LEES_MUSIC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/music.p12"
      - name: Test and build signed APK
        env:
          LEES_MUSIC_KEYSTORE: ${{ runner.temp }}/music.p12
          LEES_MUSIC_STORE_PASSWORD: ${{ secrets.LEES_MUSIC_STORE_PASSWORD }}
          LEES_MUSIC_KEY_PASSWORD: ${{ secrets.LEES_MUSIC_KEY_PASSWORD }}
        run: bash gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console=plain
      - name: Verify APK and stage corresponding source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          python3 tools/release/audit_apk.py app/build/outputs/apk/release/app-release.apk
          python3 tools/release/stage.py "$TAG"
      - name: Preserve optimization mapping separately
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-${{ inputs.tag || github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/release/* --verify-tag --latest --title "Lee's Music ${TAG#v} 正式版" --notes-file docs/RELEASE_NOTES.md
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/music.p12"
